<div class="auth-wrapper">
  <!-- Left Side: High-End 3D Animation -->
  <div class="animation-side">
    <lottie-player src="https://assets9.lottiefiles.com/packages/lf20_6wutsrox.json" 
                   background="transparent" 
                   speed="1" 
                   style="width: 100%; max-width: 600px; height: auto;" 
                   loop 
                   autoplay>
    </lottie-player>
  </div>

  <!-- Right Side: Custom Styled Registration Form -->
  <div class="form-side">
    <div class="signup-card">
      <h1 class="card-title">SIGN UP</h1>
      <p class="card-subtitle">Join LeafyBooks and start your reading journey.</p>
  
      <form (ngSubmit)="onSubmit()" #f="ngForm" novalidate *ngIf="!isSuccessful">
        <div class="visme-styled-group">
          <label>USERNAME *</label>
          <input type="text" name="username" [(ngModel)]="form.username" required minlength="3" #username="ngModel" placeholder="Ex. BookLover2026">
        </div>
  
        <div class="visme-styled-group">
          <label>EMAIL ADDRESS *</label>
          <input type="email" name="email" [(ngModel)]="form.email" required email #email="ngModel" placeholder="Ex. yourname@email.com">
        </div>
        
        <div class="visme-styled-group">
          <label>PASSWORD *</label>
          <input type="password" name="password" [(ngModel)]="form.password" required minlength="6" #password="ngModel" placeholder="••••••••">
        </div>
  
        <button type="submit" class="visme-btn">Create Account</button>
  
        <div class="error-msg" *ngIf="isSignUpFailed">
          {{errorMessage || 'Signup failed. Please try again.'}}
        </div>
      </form>
  
      <div class="success-msg" *ngIf="isSuccessful">
        Account created successfully! Redirecting to login...
      </div>
  
      <div class="divider-visme" *ngIf="!isSuccessful">
        <span>OR</span>
      </div>
  
      <div class="google-btn-container" *ngIf="!isSuccessful">
        <div id="google-btn"></div>
      </div>
  
      <div class="auth-footer-visme" *ngIf="!isSuccessful">
        Already have an account? <a routerLink="/login">Log In</a>
      </div>
    </div>
  </div>
</div>
