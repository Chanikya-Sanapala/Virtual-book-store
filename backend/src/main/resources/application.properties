# MongoDB Configuration
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bookstore}
spring.data.mongodb.auto-index-creation=false

server.port=8080

# JWT Configuration
bookstore.app.jwtSecret=bookstoreSecretKeyForJWTSecurityPurposesMustBeLongEnoughToBeSecure
bookstore.app.jwtExpirationMs=86400000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:chandanak1009@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.mongodb.driver=DEBUG

# Groq AI Configuration
groq.api.key=${GROQ_API_KEY}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Google Books API Key (Optional but recommended for bulk import)
# Get one at: https://console.cloud.google.com/apis/credentials
google.books.api.key=${GOOGLE_BOOKS_API_KEY}

# Frontend Connection
app.frontend.url=${FRONTEND_URL:https://virtual-book-store-eight.vercel.app}
